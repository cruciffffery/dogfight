<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dogfight — сервер</title>
    <style>
      :root { color-scheme: dark; --fg: #cfe0ff; --dim: #7d8db0; --line: #4da3ff; --warn: #ffb020; --bad: #ff6b6b; }
      body { margin: 0; padding: 16px; background: #0b1020; color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .meta { color: var(--dim); margin-bottom: 16px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
      .tile { background: #121a33; border-radius: 8px; padding: 10px 12px; }
      .tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
      .tile span { color: var(--dim); font-size: 12px; }
      canvas { width: 100%; height: 40px; display: block; margin-top: 6px; }
      table { border-collapse: collapse; margin-top: 16px; width: 100%; max-width: 720px; }
      td, th { text-align: left; padding: 4px 8px; border-bottom: 1px solid #1d2747; font-variant-numeric: tabular-nums; }
      .down { color: var(--bad); }
    </style>
  </head>
  <body>
    <h1>dogfight — стан сервера</h1>
    <div class="meta" id="meta">завантаження…</div>
    <div class="grid" id="tiles"></div>
    <table>
      <thead><tr><th>Кімната</th><th>Гравців</th><th>Сутностей</th><th>tick p50</th><th>tick p99</th><th>jitter p99</th></tr></thead>
      <tbody id="rooms"></tbody>
    </table>
    <table>
      <thead><tr><th>Відмови (причина)</th><th>Кількість</th></tr></thead>
      <tbody id="rejected"></tbody>
    </table>
    <script type="module" src="/src/dashboard.ts"></script>
  </body>
</html>
