# Fly.io (Лаба 8). Перед першим деплоєм: `fly launch --no-deploy` (змінить app і регіон),
# `fly secrets set ...` за потреби. Деплой — тег v* у GitHub (див. .github/workflows/deploy.yml).
app = "dogfight-CHANGE-ME"
primary_region = "waw"

[build]
  # Образ збирає GitHub Actions і кладе в GHCR; flyctl deploy --image бере готовий

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  LOG_LEVEL = "info"
  TRUST_PROXY = "1"                 # IP клієнта — з Fly-Client-IP
  ALLOWED_ORIGINS = "https://dogfight-CHANGE-ME.fly.dev"
  MAX_CONNECTIONS_PER_IP = "8"
  MAX_ROOMS = "50"
  MAX_PLAYERS_PER_ROOM = "8"
  LOG_DIR = "/tmp/logs"

[http_service]
  internal_port = 8080
  force_https = true                # http → https; браузер тоді відкриває wss://
  # Кімнати живуть у пам'яті одного процесу: рівно ОДНА машина, не засинає
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"            # WebSocket = довге з'єднання, рахуємо з'єднання, а не запити
    soft_limit = 200
    hard_limit = 300

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/ready"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[deploy]
  strategy = "immediate"            # одна машина: rolling між двома неможливий без втрати кімнат
