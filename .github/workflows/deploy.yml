name: Deploy

# Тег v* (наприклад v1.0.0) → CI → образ у GHCR → деплой на Fly.io → перевірка /health.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "version=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.ref }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: docker buildx imagetools inspect ${{ steps.meta.outputs.ref }} | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --image ${{ needs.image.outputs.ref }} --env APP_VERSION=${{ needs.image.outputs.version }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test — /health має віддати версію щойно задеплоєного тегу
        run: |
          APP=$(grep '^app' fly.toml | cut -d'"' -f2)
          for i in $(seq 1 20); do
            body=$(curl -fsS "https://$APP.fly.dev/health" || true)
            echo "$body"
            echo "$body" | grep -q '"${{ needs.image.outputs.version }}"' && exit 0
            sleep 6
          done
          exit 1
