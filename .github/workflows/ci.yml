name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call: # deploy.yml викликає цей CI перед збиранням образу

jobs:
  check:
    name: typecheck · lint · unit tests
    runs-on: ubuntu-24.04 # Playwright 1.56 не підтримує Ubuntu 26 (ubuntu-latest з жовтня 2026)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: "**/coverage/"
          if-no-files-found: ignore

  e2e:
    name: build · e2e (Playwright)
    runs-on: ubuntu-24.04 # Playwright 1.56 не підтримує Ubuntu 26 (ubuntu-latest з жовтня 2026)
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
